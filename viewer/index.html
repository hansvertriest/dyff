<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dyff PR map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --surface:#F8FAFB; --surface-2:#EEF2F5; --ink:#18202B; --muted:#535D6B; --line:#CBD3DC; --edge:#748397;
  /* Outlines of boxes and controls: at least 3:1 against the canvas and the surfaces. --line is for dividers. */
  --stroke:#7A889B;
  --accent:#3B4FD8; --accent-soft:#E2E6FB;
  --add:#157548; --add-bg:#DCF2E5; --del:#B03731; --del-bg:#F8E0DD; --mod:#905807; --mod-bg:#F5E9D2;
  --kw:#7A3BB8; --str:#1C7267; --dec:#A8530F; --com:#5C6671;
  /* Link colors, checked as one set for color-blind separation against --bg (OKLab ΔE ≥ 12). */
  --l-new:#1A83DB; --l-cyc:#79438F; --l-cyc-new:#A52932; --l-rem:#B76B1C;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#95A0AE; --line:#2D3744; --edge:#657488; --stroke:#5E738E;
    --accent:#93A1FF; --accent-soft:#252C4F;
    --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
    --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#8B94A0;
    --l-new:#4886FE; --l-cyc:#9752B4; --l-cyc-new:#B45151; --l-rem:#AB8704;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#95A0AE; --line:#2D3744; --edge:#657488; --stroke:#5E738E;
  --accent:#93A1FF; --accent-soft:#252C4F;
  --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
  --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#8B94A0;
  --l-new:#4886FE; --l-cyc:#9752B4; --l-cyc-new:#B45151; --l-rem:#AB8704;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em}

.top{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-weight:600;font-size:17px;display:flex;align-items:center;gap:9px;margin:0}
.prtitle{margin:0;font-weight:500;flex:1 1 300px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prtitle small{color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--mono);font-size:12.5px}
.commits{display:flex;align-items:center;gap:4px;min-width:0}
.commits[hidden]{display:none}
.commits select{min-width:0;max-width:320px;height:36px;padding:0 8px;border:1px solid var(--stroke);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;text-overflow:ellipsis}
.commits .iconbtn{min-width:32px;padding:0 6px}
.commits .iconbtn:disabled{opacity:.4}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;padding:7px 12px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg)}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,20,30,.14);max-height:60vh;overflow:auto;padding:4px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}
.results button:hover,.results button.on{background:var(--surface-2)}
.results small{display:block;color:var(--muted);font:11.5px var(--mono)}

main{--w1:500px;--w2:440px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0 var(--w1)}
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.stagebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 20px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.canvas.panning{cursor:grabbing}
.canvas.glide svg{transition:transform .35s ease}
@media (prefers-reduced-motion: reduce){.canvas.glide svg{transition:none}}
.canvas svg{display:block;position:absolute;left:0;top:0;transform-origin:0 0}
.opts{display:contents}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 9px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);color:var(--ink)}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn svg{flex:none}
.mobile-only{display:none !important}
.zoomctl{position:absolute;right:14px;bottom:14px;z-index:4;display:flex;flex-direction:column;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);box-shadow:0 4px 14px rgba(15,20,30,.12);overflow:hidden}
.zoomctl button{width:38px;height:38px;border:0;background:none;display:flex;align-items:center;justify-content:center;font:500 18px var(--sans);color:var(--ink)}
.zoomctl button+button{border-top:1px solid var(--line)}
.zoomctl button:hover{background:var(--surface-2)}
.sheethead{display:none}

.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--stroke);stroke-width:1}
.node:hover rect.box{stroke:var(--muted)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.affected rect.box{stroke:var(--accent);stroke-dasharray:5 4}
.node.context rect.box{fill:var(--surface-2)}
.node.hot rect.box{stroke:var(--accent);stroke-width:2}
.node .bar{fill:var(--line)}
.node.s-modified .bar{fill:var(--mod)}
.node.s-added .bar{fill:var(--add)}
.node.s-removed .bar{fill:var(--del)}
.node.affected .bar{fill:var(--accent)}
.node .nm{font:600 14px var(--sans);fill:var(--ink)}
.node .fold{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round}
.node .pth{font:12px var(--mono);fill:var(--muted)}
.node .tag{font:600 10.5px var(--sans);fill:var(--mod);letter-spacing:.03em}
.node .tag .p{fill:var(--l-cyc)} .node .tag .x{fill:var(--l-cyc-new)}
.node.ext rect.box{fill:none;stroke-dasharray:2 3}
/* The location bar: up one folder, and the path of the folder the map shows. */
.locbar{position:relative;display:flex;align-items:center;gap:2px;max-width:100%;min-width:0;height:36px;padding:0 12px 0 2px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);font-size:13px;color:var(--muted)}
.locbar>button{flex:none;display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;border:0;border-radius:8px;background:none;color:var(--ink)}
.locbar>button:hover{background:var(--surface-2)}
.locbar .lup[hidden]+.ltrail{padding-left:10px}
.ltrail{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.ltrail::-webkit-scrollbar{display:none}
.ltrail>*{flex:none}
.ltrail b,.lcur b{color:var(--ink);font-weight:600}
.locbar>.lcur{display:none}
.lmenu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:6;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,20,30,.16);max-height:50vh;overflow:auto}
.lmenu button{display:flex;align-items:center;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;font:13px var(--mono);color:var(--ink);word-break:break-all}
.lmenu button:hover,.lmenu button.on{background:var(--surface-2)}
.lmenu button.on{font-weight:500}
.node .meta{font:500 12px var(--sans);fill:var(--muted)}
.node .nv path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.node .nv circle{fill:var(--accent)}
.node .meta .a{fill:var(--add)} .node .meta .d{fill:var(--del)} .node .meta .w{fill:var(--del)}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.imp{stroke-dasharray:3 4}
.edge.chg{stroke:var(--l-new);stroke-width:2.2}
.edge.rem{stroke:var(--l-rem);stroke-dasharray:6 4;stroke-width:2}
.edge.cyc{stroke:var(--l-cyc);stroke-width:1.8}
.edge.cyc-new{stroke:var(--l-cyc-new);stroke-width:2.4}
.edge.cyc-in{stroke:var(--l-cyc-new);stroke-width:1.6;opacity:.45}
.edge.ctx{display:none}
.edge.ctx.on{display:inline}
.dim{opacity:.22}
.node,.edge{transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.node,.edge{transition:none}}
.mk-n{fill:var(--edge)} .mk-c{fill:var(--l-new)} .mk-r{fill:var(--l-rem)} .mk-p{fill:var(--l-cyc)} .mk-x{fill:var(--l-cyc-new)}

.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
/* ⌘-click (Alt-click off a Mac) opens a second sidebar to the right of the first. */
main.two{grid-template-columns:minmax(0,1fr) 0 var(--w1) 0 var(--w2)}
/* A zero-width column before each sidebar holds its resize handle, centered on the border. */
.gutter{position:relative;z-index:6;width:0}
.gutter::before{content:"";position:absolute;top:0;bottom:0;left:-4px;width:8px;cursor:col-resize}
.gutter::after{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--accent);opacity:0;transition:opacity .12s}
.gutter:hover::after,.gutter.drag::after,.gutter:focus-visible::after{opacity:1}
.gutter:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .canvas{pointer-events:none}
.pin{padding:20px 22px 40px}
.panel h2{font-size:22px;line-height:1.25;margin:0 0 2px;letter-spacing:-.01em;word-break:break-word}
.panel h3{font-size:14px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.panel h3 .count{font-weight:500;font-size:12px;border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--muted)}
.panel h3 .count.warn{background:var(--del-bg);color:var(--del)}
.panel .path{font:12.5px var(--mono);color:var(--muted);margin:0 0 10px;word-break:break-all}
.panel p{margin:0 0 10px}
.lead{color:var(--muted)}
.back{margin:-4px 0 12px -8px;border:0;background:none;color:var(--muted);padding:6px 8px;border-radius:8px}
.back:hover{color:var(--ink)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 12px}
.ptop .back{margin:0 0 0 -8px;flex:none}
.viewed{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;margin-left:auto;flex:none}
.viewed input{appearance:none;-webkit-appearance:none;flex:none;width:32px;height:18px;margin:0;border-radius:999px;background:var(--stroke);position:relative;cursor:pointer;transition:background .15s}
.viewed input::before{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,20,30,.25);transition:transform .15s}
.viewed input:checked{background:var(--accent)}
.viewed input:checked::before{transform:translateX(14px)}
.viewed:has(input:checked){color:var(--ink)}
@media (prefers-reduced-motion: reduce){.viewed input,.viewed input::before{transition:none}}
.stats{display:flex;gap:18px;margin:12px 0 4px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:20px;font-weight:600}
.stats div>span{font-size:12px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mlist li{border-bottom:1px solid var(--line)}
.mlist button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 4px;background:none;border:0;text-align:left}
.mlist button:hover{background:var(--surface-2)}
.mlist .sw{width:8px;height:22px;border-radius:3px;flex:none;background:var(--line)}
.mlist .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .sub{display:block;font:12px var(--mono);color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.n-a{color:var(--add);font-weight:500;font-size:13px} .n-d{color:var(--del);font-weight:500;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--stroke);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
button.chip:hover{border-color:var(--muted)}
.chip.chg{border-color:var(--l-new);color:var(--l-new)}
.chip.rem{border-color:var(--l-rem);color:var(--l-rem);text-decoration:line-through}
.chip.cyc{border-color:var(--l-cyc);color:var(--l-cyc)}
.chip.cyc-new{border-color:var(--l-cyc-new);color:var(--l-cyc-new)}
.legend b{width:16px;height:0;border-top:2px solid;display:inline-block}
.note{font-size:13px;color:var(--muted)}
.decl{font-size:13px;color:var(--muted)}
.decl code{font-size:12px;color:var(--ink)}
.ok{color:var(--add);font-size:13px;margin:0}

.check{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 10px}
.check button.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 12px}
.check button.row:first-child{border-top:0}
.check button.row:hover{background:var(--surface-2)}
.row .main{font-size:13px}
.row .sub{display:block;font:12px var(--mono);color:var(--muted);word-break:break-word}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font:12px var(--mono);color:var(--muted);margin-top:2px}
.chain span+span::before{content:"→ ";color:var(--edge)}

.file{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
details.file>summary.fhead{cursor:pointer;list-style:none}
details.file>summary.fhead::-webkit-details-marker{display:none}
details.file>summary.fhead::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;align-self:center;margin-right:2px}
details.file[open]>summary.fhead::before{transform:rotate(45deg)}
details.file>summary.fhead:hover{background:var(--line)}
.fhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--surface-2);flex-wrap:wrap}
.fname{font:500 13px var(--mono);word-break:break-all;flex:1;min-width:0}
.fname span{color:var(--muted);font-weight:400}
.badge{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.b-added{background:var(--add-bg);color:var(--add)} .b-removed{background:var(--del-bg);color:var(--del)}
.b-modified,.b-renamed{background:var(--mod-bg);color:var(--mod)}
.b-test{background:var(--accent-soft);color:var(--accent)}
.sym{border-top:1px solid var(--line)}
.sym>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.sym>summary::-webkit-details-marker{display:none}
.sym>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
.sym[open]>summary::before{transform:rotate(45deg)}
.sym>summary:hover{background:var(--surface-2)}
.sname{font:500 13px var(--mono);word-break:break-all}
.kind{font-size:12px;color:var(--muted)}
.route{font:500 11.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.grow{flex:1}
.sbody{padding:0 12px 12px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.diff{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--bg);font:12px/1.55 var(--mono)}
.dl{display:grid;grid-template-columns:3.4em 3.4em 1.4em max-content;min-width:100%;width:max-content}
.dl span{white-space:pre;padding:0 6px}
.dl .ln{color:var(--com);text-align:right;user-select:none;padding:0 6px 0 0}
.dl.add{background:var(--add-bg)} .dl.add .sg{color:var(--add)}
.dl.del{background:var(--del-bg)} .dl.del .sg{color:var(--del)}
.dl.gap span{color:var(--com)}
.tk-k{color:var(--kw)} .tk-s{color:var(--str)} .tk-d{color:var(--dec)} .tk-c{color:var(--com);font-style:italic}
.sig{font:12px var(--mono);margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.sig .l{color:var(--muted);font-family:var(--sans)}
.sig .b{color:var(--del)} .sig .a{color:var(--add)}
.refs{margin-top:10px}
.refs h4{font-size:12.5px;font-weight:500;margin:0 0 6px;color:var(--muted)}
.refs button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:3px 0 3px 10px;margin:0 0 3px;font:12.5px var(--mono);word-break:break-all}
.refs button:hover{border-left-color:var(--accent)}
.refs button small{color:var(--muted);font-family:var(--sans)}
.refs button.inpr{border-left-color:var(--mod)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px dashed var(--line)}
.tree.root{padding-left:0;border-left:0}
.tree li{margin:2px 0}
.tree button{background:none;border:0;padding:2px 4px;border-radius:5px;font:12.5px var(--mono);text-align:left;word-break:break-all}
.tree button:hover{background:var(--surface-2)}
.whole{border-top:1px solid var(--line)}
.whole>summary{padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted)}
.empty{padding:40px;color:var(--muted)}

.hbtn{border:1px solid var(--stroke);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.hbtn:hover{border-color:var(--muted)}
.dl{position:relative}
.cadd{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:18px;height:18px;padding:0;border:0;border-radius:5px;background:var(--accent);color:var(--surface);font:600 14px/18px var(--sans);opacity:0}
.dl:hover .cadd,.cadd:focus-visible{opacity:1}
@media (hover: none){.cadd{opacity:.55}}
.cthread{position:sticky;left:0;font-family:var(--sans);font-size:13px}
.cthread:empty{display:none}
.cthread>div{margin:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.cbody{white-space:pre-wrap;word-break:break-word;margin:0 0 4px}
.cact{display:flex;gap:10px;align-items:center}
.cform textarea{display:block;width:100%;min-height:64px;resize:vertical;margin:0 0 8px;padding:6px 8px;border:1px solid var(--stroke);border-radius:6px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
.cform .primary{border:0;border-radius:6px;background:var(--accent);color:var(--surface);padding:4px 12px;font-size:13px;font-weight:500}
.cform .hint{font-size:12px;color:var(--muted)}
.overall{display:block;width:100%;min-height:64px;resize:vertical;padding:8px 10px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);margin:0 0 10px}
.check .crow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 12px}
.check .crow:first-child{border-top:0}
.crow .main{flex:1;min-width:0}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const baseOf = p => p.slice(p.lastIndexOf('/') + 1);
const short = id => id.includes('#') ? id.slice(id.indexOf('#') + 1) : baseOf(id);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

let D, byId, modById, fileByPath, nodesByFile, M, FG, folder = '', projectRoot = '';
let selected = null, showAll = false, showLinks = false, showCycles = false, showTests = false, history = [];

/* ---------- Model ---------- */
function build() {
  byId = new Map(D.nodes.map(n => [n.id, n]));
  nodesByFile = new Map();
  for (const n of D.nodes) { if (!nodesByFile.has(n.file)) nodesByFile.set(n.file, []); nodesByFile.get(n.file).push(n); }
  FG = null;
  moduleRoots.clear(); compacted.clear();
  projectRoot = commonDir(D.files.map(f => f.path));
  modById = new Map(D.modules.map(m => [m.id, m]));
  fileByPath = new Map(D.files.map(f => [f.path, f]));
  const C = D.checks;
  const nodes = new Map();
  for (const m of D.modules) nodes.set(m.id, { id: m.id, name: m.name, mod: m, files: [], adds: 0, dels: 0, out: new Map(), inn: new Set(), warn: 0 });
  for (const f of D.files) {
    const n = nodes.get(f.module); if (!n) continue;
    if (f.change && (showTests || !f.test)) { n.files.push(f); n.adds += f.change.additions; n.dels += f.change.deletions; }
  }
  for (const d of C.danglingReferences) { const n = byId.get(d.from); if (n && nodes.has(n.module)) nodes.get(n.module).warn++; }

  const cyc = new Map(); C.cycles.forEach((c, i) => c.forEach(m => cyc.set(m, i)));
  const newCycle = new Set(C.newCycles.map(c => c.join('|')));
  const cycleState = (from, to) => !cyc.has(from) || cyc.get(from) !== cyc.get(to) ? false : newCycle.has(C.cycles[cyc.get(from)].join('|')) ? 'new' : 'old';
  const newKeys = new Set(C.newModuleDependencies.map(e => e.from + '>' + e.to));
  const edges = new Map();
  const add = (from, to, via, extra = {}) => {
    if (!from || !to || from === to || !nodes.has(from) || !nodes.has(to)) return;
    const k = from + '>' + to;
    let e = edges.get(k);
    if (!e) edges.set(k, e = { from, to, kinds: new Set(), changed: newKeys.has(k), removed: false, forwardRef: false, cycle: cycleState(from, to) });
    e.kinds.add(via); if (extra.forwardRef) e.forwardRef = true; if (extra.removed) e.removed = true;
  };
  for (const m of D.modules) if (m.change?.status !== 'removed') for (const im of m.imports) if (im.module) add(m.id, im.module, 'module-import', im);
  for (const f of D.files) {
    if (f.test || f.change?.status === 'removed') continue;
    for (const im of f.imports) { if (im.typeOnly || !im.resolved) continue; const t = fileByPath.get(im.resolved); if (t) add(f.module, t.module, 'file-import'); }
  }
  for (const e of C.removedModuleDependencies) if (!edges.has(e.from + '>' + e.to)) add(e.from, e.to, e.via, { removed: true });
  for (const e of edges.values()) { nodes.get(e.from).out.set(e.to, e); nodes.get(e.to).inn.add(e.from); }
  const affected = new Set(C.summary.affectedModules);
  for (const n of nodes.values()) {
    n.changed = n.files.length > 0;
    n.state = !n.changed ? 'none' : n.files.every(f => f.change.status === 'added') ? 'added' : n.files.every(f => f.change.status === 'removed') ? 'removed' : 'modified';
    n.affected = !n.changed && affected.has(n.id);
  }
  // Circular imports between files; an index from before file cycles has none.
  const fcyc = new Map(); (C.fileCycles || []).forEach((c, i) => c.forEach(f => fcyc.set(f, i)));
  const newFileCycle = new Set((C.newFileCycles || []).map(c => c.join('|')));
  const fileCycleState = (a, b) => !fcyc.has(a) || fcyc.get(a) !== fcyc.get(b) ? false : newFileCycle.has(C.fileCycles[fcyc.get(a)].join('|')) ? 'new' : 'old';
  M = { nodes, edges, cycleState, fileCycleState };
}

/* ---------- The folder map ---------- */
// The map walks the project's folder tree one level at a time. Each file goes to its nearest box at
// the current folder: itself, a subfolder (a chain of single-child folders is one box), or the folder
// elsewhere in the project where its path leaves the current one. moduleLayer adds the modules on top.
const moduleRoots = new Map(), compacted = new Map();
const under = (path, dir) => !dir || path.startsWith(dir + '/');
const relTo = (path, dir) => dir ? path.slice(dir.length + 1) : path;
/** The deepest folder that holds all these files. */
function commonDir(paths) {
  const dirs = paths.map(p => dirOf(p).split('/'));
  let common = dirs[0] || [];
  for (const d of dirs) { let k = 0; while (k < common.length && common[k] === d[k]) k++; common = common.slice(0, k); }
  return common.join('/');
}
/** A module's folder: the one with its module file, or the one that holds all of its files. */
function moduleRoot(mod) {
  if (!moduleRoots.has(mod)) {
    const m = modById.get(mod);
    moduleRoots.set(mod, m?.file ? dirOf(m.file) : commonDir(D.files.filter(f => f.module === mod).map(f => f.path)));
  }
  return moduleRoots.get(mod);
}
/** A folder, extended through subfolders as long as it holds only one subfolder and no files. */
function compact(dir) {
  const key = `${showTests}|${dir}`;
  if (compacted.has(key)) return compacted.get(key);
  const files = D.files.filter(f => showTests || !f.test).map(f => f.path);
  let d = dir;
  for (;;) {
    const inside = files.filter(p => under(p, d));
    const next = new Set(inside.map(p => relTo(p, d).split('/')).map(seg => seg.length > 1 ? seg[0] : null));
    if (!inside.length || next.has(null) || next.size !== 1) break;
    d = (d ? d + '/' : '') + [...next][0];
  }
  compacted.set(key, d);
  return d;
}
const folderName = dir => dir === projectRoot ? baseOf(D.root) : relTo(dir, projectRoot) + '/';
function fileGraph(folder) {
  const nodes = new Map(), edges = new Map();
  const shown = f => f && (showTests || !f.test);
  const keyOf = path => {
    const f = fileByPath.get(path);
    if (!f) return null;
    if (under(path, folder)) {
      const rest = relTo(path, folder), i = rest.indexOf('/');
      return i < 0 ? path : 'dir:' + compact((folder ? folder + '/' : '') + rest.slice(0, i));
    }
    // Outside the current folder: the folder (or file) where its path leaves the current one.
    const a = folder.split('/'), b = path.split('/');
    let k = 0;
    while (k < a.length && k < b.length - 1 && a[k] === b[k]) k++;
    return k === b.length - 1 ? path : 'dir:' + compact(b.slice(0, k + 1).join('/'));
  };
  const warns = new Map();
  for (const d of D.checks.danglingReferences) { const f = byId.get(d.from)?.file; if (f) warns.set(f, (warns.get(f) || 0) + 1); }
  const usesChanged = f => !f.change && (nodesByFile.get(f.path) || []).some(n => n.uses.some(u => byId.get(u)?.change));
  const stateOf = files => {
    const ch = files.filter(f => f.change);
    if (!ch.length) return 'none';
    for (const st of ['added', 'removed']) if (files.every(f => f.change?.status === st)) return st;
    return 'modified';
  };
  for (const f of D.files) {
    if (!shown(f)) continue;
    const k = keyOf(f.path);
    let n = nodes.get(k);
    if (!n) {
      const outside = !under(f.path, folder), dir = k.startsWith('dir:') ? k.slice(4) : null;
      n = { id: k, files: [], ext: outside, outside, out: new Map(), inn: new Set() };
      if (dir) Object.assign(n, { dir, name: outside ? folderName(dir) : relTo(dir, folder) + '/', sub: outside ? 'Elsewhere' : dir + '/' });
      else Object.assign(n, { file: f, name: baseOf(f.path), sub: (dirOf(f.path) || '.') + '/' });
      nodes.set(k, n);
    }
    n.files.push(f);
  }
  for (const n of nodes.values()) {
    const fs = n.files;
    n.state = stateOf(fs);
    n.changed = n.state !== 'none';
    n.nChanged = fs.filter(f => f.change).length;
    n.affected = !n.changed && fs.some(usesChanged);
    n.adds = fs.reduce((a, f) => a + (f.change?.additions || 0), 0);
    n.dels = fs.reduce((a, f) => a + (f.change?.deletions || 0), 0);
    n.warn = fs.reduce((a, f) => a + (warns.get(f.path) || 0), 0);
  }
  markUnviewed(nodes);
  // A link between two boxes stands for all file imports between them; each import is a pair, seen
  // now (after the PR) and/or before it.
  const link = (a, b, pk, side, extra) => {
    // Links between two boxes outside the current folder belong to another level.
    if (!a || !b || a === b || !nodes.has(a) || !nodes.has(b) || (nodes.get(a).outside && nodes.get(b).outside)) return;
    const k = a + '>' + b;
    let e = edges.get(k);
    if (!e) edges.set(k, e = { from: a, to: b, pairs: new Map(), typeOnly: true, cycle: false });
    let pr = e.pairs.get(pk);
    if (!pr) e.pairs.set(pk, pr = { now: false, before: false, unknown: false, ...extra });
    pr[side] = true;
    return e;
  };
  for (const f of D.files) {
    if (!shown(f)) continue;
    const ch = f.change;
    // Before-side imports: unchanged files have the same imports; an index without previousImports can't tell.
    const before = !ch ? f.imports : ch.status === 'added' ? [] : ch.previousImports;
    const sides = [['now', ch?.status === 'removed' ? [] : f.imports], ['before', before || []]];
    for (const [side, list] of sides) for (const im of list) {
      const t = fileByPath.get(im.resolved);
      if (!shown(t)) continue;
      const pk = f.path + '>' + t.path, e = link(keyOf(f.path), keyOf(t.path), pk, side, { unknown: !before, mods: [f.module, t.module] });
      if (e && !im.typeOnly) e.typeOnly = false;
      if (e && side === 'now' && !im.typeOnly && !f.test && !t.test) e.pairs.get(pk).fcycle = M.fileCycleState(f.path, t.path);
    }
  }
  const G = { folder, tests: showTests, keyOf, nodes, edges, link };
  moduleLayer(G);
  for (const e of edges.values()) {
    const ps = [...e.pairs.values()];
    e.changed = ps.some(p => p.now && !p.before && !p.unknown);
    e.removed = ps.every(p => p.before && !p.now && !p.unknown);
    e.files = ps.filter(p => p.mods).length;
    // A link can be part of a circular module dependency and of circular file imports at once.
    e.mcycle = ps.some(p => p.cycle === 'new') ? 'new' : ps.some(p => p.cycle) ? 'old' : false;
    e.fcycle = ps.some(p => p.fcycle === 'new') ? 'new' : ps.some(p => p.fcycle) ? 'old' : false;

/** Every file the PR touched, analyzed or not. */

  return [...D.files.filter(f => f.change), ...other].sort((a, b) => (a.test - b.test) || (!!a.other - !!b.other) || bySize(a, b));

/* ---------- Module ---------- */
function renderModule(id) {
  const n = M.nodes.get(id), m = n.mod;

  const chip = (e, other) => `<button class="chip ${e.removed ? 'rem' : e.cycle === 'new' ? 'cyc-new' : e.cycle ? 'cyc' : e.changed ? 'chg' : ''}" data-mod="${esc(other)}" title="${e.removed ? 'Removed in this PR' : e.cycle === 'new' ? 'Part of a cycle this PR creates' : e.cycle ? 'Part of a cycle that already existed' : e.changed ? 'New in this PR' : ''}">${esc(M.nodes.get(other).name)}${e.kinds.has('module-import') ? '' : ' (file)'}</button>`;
  let why;
  if (n.changed) why = `${plural(n.files.length, 'file')} ${n.state === 'added' ? 'added' : n.state === 'removed' ? 'removed' : 'changed'} in this PR.`;
  else if (n.affected) why = 'Not changed in this PR, but its code references something that did. Worth a look when reviewing.';

  const declHtml = m.declared ? [

    ${broken.length ? `<h3>Broken references<span class="count warn">${broken.length}</span></h3><div class="refs">${broken.map(d => symBtn(d.from, ` · uses removed ${esc(symLabel(d.to))}`)).join('')}</div>` : ''}
    ${outs.length ? `<h3>Depends on</h3><div class="chips">${outs.map(e => chip(e, e.to)).join('')}</div>` : ''}
    ${ins.length ? `<h3>Used by</h3><div class="chips">${ins.map(e => chip(e, e.from)).join('')}</div>` : ''}
    ${routes.length ? `<h3>Routes</h3><div class="refs">${routes.map(r => `<button data-sym="${esc(r.id)}">${esc(routeText(r.route))} <small>${esc(short(r.id))}</small></button>`).join('')}</div>` : ''}
    ${n.files.length ? `<h3>What changed</h3>${files}` : ''}`;
}

/* ---------- Folder ---------- */
function renderFolder(dir) {
  const inFolder = D.files.filter(f => under(f.path, dir) && (showTests || !f.test));
  const mods = D.modules.filter(m => m.file && under(m.file, dir));
  const changed = inFolder.filter(f => f.change).sort(bySize);
  const affected = inFolder.filter(f => !f.change && (nodesByFile.get(f.path) || []).some(n => n.uses.some(u => byId.get(u)?.change)));
  const a = changed.reduce((x, f) => x + f.change.additions, 0), d = changed.reduce((x, f) => x + f.change.deletions, 0);
  out.innerHTML = `

    <p class="lead">${changed.length ? `${plural(changed.length, 'file')} of ${inFolder.length} changed in this folder and below.` : `None of its ${plural(inFolder.length, 'file')} changed in this PR.`}</p>

/* ---------- Symbol focus ---------- */
function tree(id, dir, depth, seen) {

  if (!items.length) return '';
  items.forEach(x => seen.add(x));
  return `<ul class="tree${seen.size === items.length + 1 ? ' root' : ''}">${items.slice(0, 30).map(x => {
    const n = byId.get(x);
    return `<li><button data-sym="${esc(x)}">${esc(symLabel(x))}${n.route ? ' ' + routeChip(n.route) : ''}${n.change ? ` <span class="badge b-${n.change.status}">${statusWord(n.change.status)}</span>` : ''}${n.test ? ' <span class="badge b-test">test</span>' : ''}</button>${tree(x, dir, depth - 1, seen)}</li>`;
  }).join('')}${items.length > 30 ? `<li class="note">…and ${items.length - 30} more</li>` : ''}</ul>`;
}
function renderSymbol(id) {

  const file = n.kind === 'file' ? fileByPath.get(n.file) : null;
  const fc = file && (C.fileCycles || []).find(c => c.includes(file.path));

  out.innerHTML = `

    <p class="path">${esc(n.file)}:${n.range[0]}–${n.range[1]} · ${esc(kindWord(n))} · <button class="linkbtn" data-mod="${esc(n.module)}">${esc(modName(n.module))}</button></p>
    <div class="chips" style="margin-bottom:10px">${ch ? `<span class="badge b-${ch.status}">${statusWord(ch.status)} in this PR</span>` : '<span class="badge">unchanged</span>'}${n.route ? routeChip(n.route) : ''}${n.test ? '<span class="badge b-test">test</span>' : ''}${n.decorators ? n.decorators.map(d => `<span class="badge">@${esc(d)}</span>`).join('') : ''}</div>
    ${n.signature || ch?.previousSignature ? `<div class="sig">${ch?.signatureChanged ? `<span class="l">Before</span><span class="b">${esc(ch.previousSignature)}</span><span class="l">After</span><span class="a">${esc(n.signature)}</span>` : `<span class="l">Signature</span><span>${esc(n.signature)}</span>`}</div>` : ''}
    ${broken.length ? `<h3>Broken references<span class="count warn">${broken.length}</span></h3><div class="refs">${broken.map(d => d.from === id ? symBtn(d.to, ' · removed by this PR') : symBtn(d.from, ' · still calls this')).join('')}</div>` : ''}
    ${fc ? `<h3>Circular imports<span class="count ${fcNew ? 'warn' : ''}">${fc.length - 1}</span></h3><p class="note">${fcNew ? 'This PR creates a cycle of imports between this file and these.' : 'This file is part of a cycle of imports that already existed.'}</p><div class="refs">${fc.filter(f => f !== file.path).map(f => symBtn(f)).join('')}</div>` : ''}

    <h3>Called from<span class="count">${n.references.length}</span></h3>
    ${n.references.length ? `<p class="note">Callers, and their callers, up to 3 steps.</p>${tree(id, 'up', 3, new Set([id]))}` : '<p class="note">Nothing references this.</p>'}

}

/* ---------- Navigation ---------- */
let view = { type: 'summary' }, out = $('#pin');
/** Render a view's details into a sidebar. */
function renderView(v, el) {

}
function go(next, push = true) {

  // A module opens its folder and a symbol the folder of its file; the folder is kept in the view so Back returns to it.
  folder = view.folder = folderFor(view.folder ?? (sym ? dirOf(sym.file) : view.type === 'folder' ? view.id : view.type === 'module' && modById.has(view.id) ? moduleRoot(view.id) : undefined));

  }

  $('#sheetBtn').setAttribute('aria-label', `Open the details: ${view.type === 'summary' ? 'summary' : view.type === 'module' ? modName(view.id) : view.type === 'folder' ? folderName(view.id) : symLabel(view.id)}`);
  // A tap on the empty map deselects without opening the details again, and opening a folder only

/* ---------- Sidebar widths ---------- */
// Drag the border left of a sidebar (or focus it and use the arrow keys) to resize it; a double-click
// resets it. The widths are remembered in this browser and shrink to leave the map some room.
const MIN_W = 280, MAP_MIN = 320, DEFAULT_W = { w1: 500, w2: 440 };
let widths = { ...DEFAULT_W };
try { Object.assign(widths, JSON.parse(localStorage.getItem('dyff-widths') || '{}')); } catch { /* storage unavailable */ }
function applyWidths() {
  let { w1, w2 } = widths;
  const room = window.innerWidth - MAP_MIN, total = side ? w1 + w2 : w1;
  if (total > room) { const k = Math.max(0, room) / total; w1 = Math.max(MIN_W, w1 * k); w2 = Math.max(MIN_W, w2 * k); }
  const m = $('main');
  m.style.setProperty('--w1', Math.round(w1) + 'px');
  m.style.setProperty('--w2', Math.round(w2) + 'px');
  refit();
}
function setWidth(key, w) {
  widths[key] = Math.max(MIN_W, Math.round(w));
  try { localStorage.setItem('dyff-widths', JSON.stringify(widths)); } catch { /* storage unavailable */ }
  applyWidths();
}
for (const [id, key] of [['#gut1', 'w1'], ['#gut2', 'w2']]) {
  const g = $(id), panel = () => g.nextElementSibling;
  let x0 = null, w0 = 0;
  g.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    x0 = e.clientX; w0 = panel().offsetWidth;
    g.setPointerCapture(e.pointerId);
    g.classList.add('drag'); document.body.classList.add('resizing');
  });
  g.addEventListener('pointermove', e => {
    if (x0 === null) return;
    // The sidebar is right of its border: dragging left widens it, up to what leaves the map its room.
    const other = key === 'w1' ? (side ? $('#panel2').offsetWidth : 0) : $('#panel').offsetWidth;
    setWidth(key, Math.min(w0 - (e.clientX - x0), window.innerWidth - MAP_MIN - other));
  });
  const end = () => { if (x0 === null) return; x0 = null; g.classList.remove('drag'); document.body.classList.remove('resizing'); };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('dblclick', () => setWidth(key, DEFAULT_W[key]));
  g.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    setWidth(key, panel().offsetWidth + (e.key === 'ArrowLeft' ? 24 : -24));
  });
}
applyWidths();

{

  if (q.length < 2) { box.hidden = true; return; }
  const hits = searchIndex.filter(s => s.key.includes(q)).sort((a, b) => (a.key.indexOf(q) - b.key.indexOf(q)) || a.label.length - b.label.length).slice(0, 30);
  box.innerHTML = hits.length ? hits.map((h, i) => `<button ${h.mod ? `data-mod="${esc(h.mod)}"` : `data-sym="${esc(h.id)}"`} class="${i ? '' : 'on'}">${esc(h.label)}<small>${esc(h.sub)}</small></button>`).join('') : '<p class="note" style="padding:6px 8px;margin:0">No matches</p>';
  box.hidden = false;
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const b = $('#results button.on'); if (b) b.click(); }
  if (e.key === 'Escape') closeSearch();
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });

function title() {
  const pr = D.pr || {};
  return pr.baseRef ? `Changes against ${pr.baseRef}` : 'Pull request';
}

/* ---------- Load ---------- */
// Several merged indexes (e.g. one per commit) come as a list of labels; one of them is shown at a time.
let indexes = null, current = 0;
const fetchJson = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const loadIndex = i => window.DYFF_LIST ? Promise.resolve(window.DYFF_LIST[i].index)
  : window.DYFF_DATA ? Promise.resolve(window.DYFF_DATA) : fetchJson(indexes ? `index.json?i=${i}` : 'index.json');
const failed = err => { $('#pin').innerHTML = `<p class="empty">Could not load index.json (${esc(err.message)}).</p>`; };
/** The view to keep after switching index, when what it shows still exists there. */
function keptView(v) {
  if (!v || !D.files.some(f => under(f.path, v.folder))) return { type: 'summary' };
  if (v.type === 'module' && !M.nodes.has(v.id)) return { type: 'summary' };
  if (v.type === 'symbol' && !byId.has(v.id)) return { type: 'folder', id: v.folder, folder: v.folder };
  return { ...v, fromCanvas: true };
}
function useIndex(data) {
  const prev = D ? view : null;
  D = data;
  if (!D.checks) { $('#pin').innerHTML = '<p class="empty">This index has no PR checks. Serve the output of <code>dyff merge</code> or <code>dyff pr</code>.</p>'; return; }
  const pr = D.pr || {};
  $('#prTitle').innerHTML = `${esc(baseOf(D.root))} · ${esc(title())}${pr.headCommit ? `<small>${esc(pr.baseCommit?.slice(0, 7) || '')}…${esc(pr.headCommit.slice(0, 7))}</small>` : ''}`;
  document.title = `dyff · ${baseOf(D.root)}`;
  review = { body: '', comments: [] };
  loadReview();
  loadViewed();
  searchIndex = [
    ...D.nodes.filter(n => n.kind !== 'file').map(n => ({ id: n.id, label: short(n.id) + (n.route ? '  ' + routeText(n.route) : ''), sub: n.file, key: (short(n.id) + ' ' + (n.route ? routeText(n.route) : '')).toLowerCase() })),
    ...D.modules.map(m => ({ mod: m.id, label: m.name, sub: m.id, key: (m.name + ' ' + m.id).toLowerCase() })),
  ];
  selected = null;
  build();
  history = [];
  closeSide();
  go(keptView(prev), false);
}
function renderCommits() {
  const box = $('#commits');
  box.hidden = !indexes;
  $('.top').classList.toggle('multi', !!indexes);
  if (!indexes) return;
  $('#commitSel').innerHTML = indexes.map((l, i) => `<option value="${i}"${i === current ? ' selected' : ''}>${i + 1}/${indexes.length} · ${esc(l)}</option>`).join('');
  box.querySelector('[data-step="-1"]').disabled = current === 0;
  box.querySelector('[data-step="1"]').disabled = current === indexes.length - 1;
}
function showIndex(i) {
  if (!indexes || i < 0 || i >= indexes.length) return;
  current = i;
  renderCommits();
  loadIndex(i).then(useIndex).catch(failed);
}
$('#commitSel').addEventListener('change', e => showIndex(Number(e.target.value)));
$('#commits').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) showIndex(current + Number(b.dataset.step)); });
(window.DYFF_LIST ? Promise.resolve(window.DYFF_LIST.map(x => x.label)) : window.DYFF_DATA ? Promise.resolve(null) : fetch('indexes.json').then(r => r.ok ? r.json() : null, () => null))
  .then(labels => { indexes = labels && labels.length > 1 ? labels : null; renderCommits(); return loadIndex(0); })
  .then(useIndex).catch(failed);
})();
</script>
</body>
</html>
