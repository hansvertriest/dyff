<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dyff PR map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --surface:#F8FAFB; --surface-2:#EEF2F5; --ink:#18202B; --muted:#5A6574; --line:#CBD3DC; --edge:#9AA5B3;
  --accent:#3B4FD8; --accent-soft:#E2E6FB;
  --add:#17804F; --add-bg:#DCF2E5; --del:#B83A33; --del-bg:#F8E0DD; --mod:#9C5F08; --mod-bg:#F5E9D2;
  --kw:#7A3BB8; --str:#1E7A6E; --dec:#A8530F; --com:#7C8794;
  /* Link colors, checked as one set for color-blind separation against --bg (OKLab ΔE ≥ 12). */
  --l-new:#1A83DB; --l-cyc:#79438F; --l-cyc-new:#A52932; --l-rem:#B76B1C;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#8E99A8; --line:#2D3744; --edge:#556172;
    --accent:#93A1FF; --accent-soft:#252C4F;
    --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
    --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#76818F;
    --l-new:#4886FE; --l-cyc:#9752B4; --l-cyc-new:#B45151; --l-rem:#AB8704;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#8E99A8; --line:#2D3744; --edge:#556172;
  --accent:#93A1FF; --accent-soft:#252C4F;
  --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
  --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#76818F;
  --l-new:#4886FE; --l-cyc:#9752B4; --l-cyc-new:#B45151; --l-rem:#AB8704;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em}

.top{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-weight:600;font-size:17px;display:flex;align-items:center;gap:9px;margin:0}
.prtitle{margin:0;font-weight:500;flex:1 1 300px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prtitle small{color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--mono);font-size:12.5px}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,20,30,.14);max-height:60vh;overflow:auto;padding:4px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}
.results button:hover,.results button.on{background:var(--surface-2)}
.results small{display:block;color:var(--muted);font:11.5px var(--mono)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 500px}
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.stagebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 20px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.canvas{flex:1;min-height:0;overflow:auto;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.canvas svg{display:block;height:auto}

.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.node:hover rect.box{stroke:var(--edge)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.affected rect.box{stroke:var(--accent);stroke-dasharray:5 4}
.node.context rect.box{fill:var(--surface-2)}
.node.hot rect.box{stroke:var(--accent);stroke-width:2}
.node .bar{fill:var(--line)}
.node.s-modified .bar{fill:var(--mod)}
.node.s-added .bar{fill:var(--add)}
.node.s-removed .bar{fill:var(--del)}
.node.affected .bar{fill:var(--accent)}
.node .nm{font:600 14px var(--sans);fill:var(--ink)}
.node .pth{font:12px var(--mono);fill:var(--muted)}
.node.ext rect.box{fill:none;stroke-dasharray:2 3}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);width:100%}
.crumbs b{color:var(--ink);font-weight:600}
.node .meta{font:500 12px var(--sans);fill:var(--muted)}
.node .meta .a{fill:var(--add)} .node .meta .d{fill:var(--del)} .node .meta .w{fill:var(--del)}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.imp{stroke-dasharray:3 4}
.edge.chg{stroke:var(--l-new);stroke-width:2.2}
.edge.rem{stroke:var(--l-rem);stroke-dasharray:6 4;stroke-width:2}
.edge.cyc{stroke:var(--l-cyc);stroke-width:1.8}
.edge.cyc-new{stroke:var(--l-cyc-new);stroke-width:2.4}
.edge.ctx{display:none}
.edge.ctx.on{display:inline}
.dim{opacity:.22}
.node,.edge{transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.node,.edge{transition:none}}
.mk-n{fill:var(--edge)} .mk-c{fill:var(--l-new)} .mk-r{fill:var(--l-rem)} .mk-p{fill:var(--l-cyc)} .mk-x{fill:var(--l-cyc-new)}

.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
.pin{padding:20px 22px 40px}
.panel h2{font-size:22px;line-height:1.25;margin:0 0 2px;letter-spacing:-.01em;word-break:break-word}
.panel h3{font-size:14px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.panel h3 .count{font-weight:500;font-size:12px;border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--muted)}
.panel h3 .count.warn{background:var(--del-bg);color:var(--del)}
.panel .path{font:12.5px var(--mono);color:var(--muted);margin:0 0 10px;word-break:break-all}
.panel p{margin:0 0 10px}
.lead{color:var(--muted)}
.back{margin:-4px 0 12px -8px;border:0;background:none;color:var(--muted);padding:6px 8px;border-radius:8px}
.back:hover{color:var(--ink)}
.stats{display:flex;gap:18px;margin:12px 0 4px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:20px;font-weight:600}
.stats div>span{font-size:12px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mlist li{border-bottom:1px solid var(--line)}
.mlist button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 4px;background:none;border:0;text-align:left}
.mlist button:hover{background:var(--surface-2)}
.mlist .sw{width:8px;height:22px;border-radius:3px;flex:none;background:var(--line)}
.mlist .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .sub{display:block;font:12px var(--mono);color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.n-a{color:var(--add);font-weight:500;font-size:13px} .n-d{color:var(--del);font-weight:500;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
button.chip:hover{border-color:var(--edge)}
.chip.chg{border-color:var(--l-new);color:var(--l-new)}
.chip.rem{border-color:var(--l-rem);color:var(--l-rem);text-decoration:line-through}
.chip.cyc{border-color:var(--l-cyc);color:var(--l-cyc)}
.chip.cyc-new{border-color:var(--l-cyc-new);color:var(--l-cyc-new)}
.legend b{width:16px;height:0;border-top:2px solid;display:inline-block}
.note{font-size:13px;color:var(--muted)}
.decl{font-size:13px;color:var(--muted)}
.decl code{font-size:12px;color:var(--ink)}
.ok{color:var(--add);font-size:13px;margin:0}

.check{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 10px}
.check button.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 12px}
.check button.row:first-child{border-top:0}
.check button.row:hover{background:var(--surface-2)}
.row .main{font-size:13px}
.row .sub{display:block;font:12px var(--mono);color:var(--muted);word-break:break-word}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font:12px var(--mono);color:var(--muted);margin-top:2px}
.chain span+span::before{content:"→ ";color:var(--edge)}

.file{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
details.file>summary.fhead{cursor:pointer;list-style:none}
details.file>summary.fhead::-webkit-details-marker{display:none}
details.file>summary.fhead::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;align-self:center;margin-right:2px}
details.file[open]>summary.fhead::before{transform:rotate(45deg)}
details.file>summary.fhead:hover{background:var(--line)}
.fhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--surface-2);flex-wrap:wrap}
.fname{font:500 13px var(--mono);word-break:break-all;flex:1;min-width:0}
.fname span{color:var(--muted);font-weight:400}
.badge{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.b-added{background:var(--add-bg);color:var(--add)} .b-removed{background:var(--del-bg);color:var(--del)}
.b-modified,.b-renamed{background:var(--mod-bg);color:var(--mod)}
.b-test{background:var(--accent-soft);color:var(--accent)}
.sym{border-top:1px solid var(--line)}
.sym>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.sym>summary::-webkit-details-marker{display:none}
.sym>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
.sym[open]>summary::before{transform:rotate(45deg)}
.sym>summary:hover{background:var(--surface-2)}
.sname{font:500 13px var(--mono);word-break:break-all}
.kind{font-size:12px;color:var(--muted)}
.route{font:500 11.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.grow{flex:1}
.sbody{padding:0 12px 12px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.diff{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--bg);font:12px/1.55 var(--mono)}
.dl{display:grid;grid-template-columns:3.4em 3.4em 1.4em max-content;min-width:100%;width:max-content}
.dl span{white-space:pre;padding:0 6px}
.dl .ln{color:var(--com);text-align:right;user-select:none;padding:0 6px 0 0}
.dl.add{background:var(--add-bg)} .dl.add .sg{color:var(--add)}
.dl.del{background:var(--del-bg)} .dl.del .sg{color:var(--del)}
.dl.gap span{color:var(--com)}
.tk-k{color:var(--kw)} .tk-s{color:var(--str)} .tk-d{color:var(--dec)} .tk-c{color:var(--com);font-style:italic}
.sig{font:12px var(--mono);margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.sig .l{color:var(--muted);font-family:var(--sans)}
.sig .b{color:var(--del)} .sig .a{color:var(--add)}
.refs{margin-top:10px}
.refs h4{font-size:12.5px;font-weight:500;margin:0 0 6px;color:var(--muted)}
.refs button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:3px 0 3px 10px;margin:0 0 3px;font:12.5px var(--mono);word-break:break-all}
.refs button:hover{border-left-color:var(--accent)}
.refs button small{color:var(--muted);font-family:var(--sans)}
.refs button.inpr{border-left-color:var(--mod)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px dashed var(--line)}
.tree.root{padding-left:0;border-left:0}
.tree li{margin:2px 0}
.tree button{background:none;border:0;padding:2px 4px;border-radius:5px;font:12.5px var(--mono);text-align:left;word-break:break-all}
.tree button:hover{background:var(--surface-2)}
.whole{border-top:1px solid var(--line)}
.whole>summary{padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted)}
.empty{padding:40px;color:var(--muted)}

.hbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.hbtn:hover{border-color:var(--edge)}
.dl{position:relative}
.cadd{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:18px;height:18px;padding:0;border:0;border-radius:5px;background:var(--accent);color:var(--surface);font:600 14px/18px var(--sans);opacity:0}
.dl:hover .cadd,.cadd:focus-visible{opacity:1}
@media (hover: none){.cadd{opacity:.55}}
.cthread{position:sticky;left:0;font-family:var(--sans);font-size:13px}
.cthread:empty{display:none}
.cthread>div{margin:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.cbody{white-space:pre-wrap;word-break:break-word;margin:0 0 4px}
.cact{display:flex;gap:10px;align-items:center}
.cform textarea{display:block;width:100%;min-height:64px;resize:vertical;margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
.cform .primary{border:0;border-radius:6px;background:var(--accent);color:var(--surface);padding:4px 12px;font-size:13px;font-weight:500}
.cform .hint{font-size:12px;color:var(--muted)}
.overall{display:block;width:100%;min-height:64px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);margin:0 0 10px}
.check .crow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 12px}
.check .crow:first-child{border-top:0}
.crow .main{flex:1;min-width:0}
.crow .cbody{font-size:13px;margin:2px 0 0}

@media (max-width: 960px){
  body{height:auto;min-height:100%}
  main{display:block}
  .stage{height:62vh;min-height:360px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .top{padding:12px 16px}
  .stagebar{padding:10px 16px 0}
  .pin{padding:18px 16px 36px}
  .search{flex:1 1 100%}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="2" width="8" height="6" rx="2" fill="var(--accent)"/><rect x="13" y="8" width="8" height="6" rx="2" fill="var(--mod)"/><rect x="1" y="14" width="8" height="6" rx="2" fill="var(--edge)"/><path d="M9 5h2a2 2 0 0 1 2 2v2M9 17h2a2 2 0 0 0 2-2v-2" stroke="var(--edge)" stroke-width="1.5" fill="none"/></svg>
    dyff
  </h1>
  <p class="prtitle" id="prTitle"></p>
  <div class="search">
    <input id="q" type="search" placeholder="Find a class, method or route…" autocomplete="off" spellcheck="false" aria-label="Find a symbol">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="hbtn" id="dlReview" type="button" hidden title="A GitHub pull request review, with each comment's line of code and symbol for context">Download comments</button>
</header>
<main>
  <section class="stage" aria-label="Module graph">
    <div class="stagebar">
      <nav class="crumbs" id="crumbs" aria-label="Map level" hidden></nav>
      <label class="toggle" id="allWrap"><input type="checkbox" id="showAll"> Show all modules</label>
      <label class="toggle"><input type="checkbox" id="showLinks"> Show all links</label>
      <label class="toggle"><input type="checkbox" id="showCycles"> Show existing cycles</label>
      <label class="toggle"><input type="checkbox" id="showTests"> Count test files</label>
      <div class="legend" aria-label="Legend">
        <span><i style="background:var(--mod)"></i>Changed</span>
        <span><i style="background:var(--add)"></i>New</span>
        <span><i style="background:var(--del)"></i>Removed</span>
        <span><i style="border:1.5px dashed var(--accent)"></i>Uses changed code</span>
        <span><b style="color:var(--l-new)"></b>New dependency</span>
        <span><b style="color:var(--l-rem);border-top-style:dashed"></b>Removed dependency</span>
        <span><b style="color:var(--l-cyc-new);border-top-width:3px"></b>New cycle</span>
        <span><b style="color:var(--l-cyc)"></b>Existing cycle</span>
      </div>
    </div>
    <div class="canvas" id="canvas"></div>
  </section>
  <aside class="panel" id="panel" aria-label="Details"><div class="pin" id="pin"><p class="empty">Loading…</p></div></aside>
</main>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const baseOf = p => p.slice(p.lastIndexOf('/') + 1);
const short = id => id.includes('#') ? id.slice(id.indexOf('#') + 1) : baseOf(id);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

let D, byId, modById, fileByPath, nodesByFile, M, FG, zoom = null;
let selected = null, showAll = false, showLinks = false, showCycles = false, showTests = false, history = [];

/* ---------- Model ---------- */
function build() {
  byId = new Map(D.nodes.map(n => [n.id, n]));
  nodesByFile = new Map();
  for (const n of D.nodes) { if (!nodesByFile.has(n.file)) nodesByFile.set(n.file, []); nodesByFile.get(n.file).push(n); }
  FG = null;
  modById = new Map(D.modules.map(m => [m.id, m]));
  fileByPath = new Map(D.files.map(f => [f.path, f]));
  const C = D.checks;
  const nodes = new Map();
  for (const m of D.modules) nodes.set(m.id, { id: m.id, name: m.name, mod: m, files: [], adds: 0, dels: 0, out: new Map(), inn: new Set(), warn: 0 });
  for (const f of D.files) {
    const n = nodes.get(f.module); if (!n) continue;
    if (f.change && (showTests || !f.test)) { n.files.push(f); n.adds += f.change.additions; n.dels += f.change.deletions; }
  }
  for (const d of C.danglingReferences) { const n = byId.get(d.from); if (n && nodes.has(n.module)) nodes.get(n.module).warn++; }

  const cyc = new Map(); C.cycles.forEach((c, i) => c.forEach(m => cyc.set(m, i)));
  const newCycle = new Set(C.newCycles.map(c => c.join('|')));
  const cycleState = (from, to) => !cyc.has(from) || cyc.get(from) !== cyc.get(to) ? false : newCycle.has(C.cycles[cyc.get(from)].join('|')) ? 'new' : 'old';
  const newKeys = new Set(C.newModuleDependencies.map(e => e.from + '>' + e.to));
  const edges = new Map();
  const add = (from, to, via, extra = {}) => {
    if (!from || !to || from === to || !nodes.has(from) || !nodes.has(to)) return;
    const k = from + '>' + to;
    let e = edges.get(k);

    <p class="foot">Select a module in the map, a check above, or search for any symbol. References are exact (resolved by the TypeScript compiler) and include the whole codebase, not just the files in this PR. Solid arrows are <code>@Module</code> imports, dotted ones are file imports only. Blue arrows are new in this PR, purple ones are part of a cycle that already existed, red ones are removed or part of a cycle this PR creates.</p>`;
}

/* ---------- Review comments ---------- */
// Kept in this browser per head commit, so they survive reloads and a new `dyff serve`.
let review = { body: '', comments: [] };
const reviewKey = () => 'dyff-review:' + (D.pr?.headCommit || D.root);
function loadReview() {
  try {
    const r = JSON.parse(localStorage.getItem(reviewKey()) || 'null');
    if (r && Array.isArray(r.comments)) review = { body: String(r.body || ''), comments: r.comments };
  } catch { /* storage unavailable */ }
  updateReviewButton();
}
function saveReview() {
  try { localStorage.setItem(reviewKey(), JSON.stringify(review)); } catch { /* storage unavailable */ }
  updateReviewButton();
}
function updateReviewButton() {
  const n = review.comments.length, b = $('#dlReview');
  b.hidden = !n && !review.body.trim();
  b.textContent = n ? `Download ${plural(n, 'comment')}` : 'Download review';
}
const byPosition = (a, b) => a.path.localeCompare(b.path) || (a.side === b.side ? a.line - b.line : a.side === 'LEFT' ? -1 : 1) || a.created - b.created;
const lineComments = (path, side, line) => review.comments.filter(c => c.path === path && c.side === side && c.line === +line);
const commentHtml = c => `<div class="cmt" data-id="${esc(c.id)}"><p class="cbody">${esc(c.body)}</p><div class="cact"><button class="linkbtn" type="button" data-c="edit">Edit</button><button class="linkbtn" type="button" data-c="del">Delete</button></div></div>`;
const threadHtml = (path, side, line) => lineComments(path, side, line).map(commentHtml).join('');
const formHtml = (text = '', id = '') => `<div class="cform"${id ? ` data-id="${esc(id)}"` : ''}><textarea aria-label="Comment" placeholder="Comment on this line">${esc(text)}</textarea><div class="cact"><button class="primary" type="button" data-c="save">${id ? 'Save' : 'Comment'}</button><button class="linkbtn" type="button" data-c="cancel">Cancel</button><span class="hint">⌘/Ctrl+Enter to save</span></div></div>`;
/** Re-render every thread of one line: the same line can show in a symbol's diff and in the whole file diff. */
function refreshThreads(path, side, line) {
  for (const t of document.querySelectorAll(`.cthread[data-path="${CSS.escape(path)}"][data-side="${side}"][data-line="${line}"]`))
    t.innerHTML = threadHtml(path, side, line);
}
function openForm(thread, text, id) {
  const f = thread.querySelector('.cform');
  if (f) { f.querySelector('textarea').focus(); return; }
  thread.insertAdjacentHTML('beforeend', formHtml(text, id));
  const ta = thread.querySelector('.cform textarea');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function saveForm(form) {
  const t = form.closest('.cthread'), body = form.querySelector('textarea').value.trim();
  const { path, side } = t.dataset, line = +t.dataset.line;
  const existing = form.dataset.id && review.comments.find(c => c.id === form.dataset.id);
  if (existing) {
    if (body) existing.body = body;
    else review.comments = review.comments.filter(c => c !== existing);
  } else if (body) {
    const row = t.previousElementSibling;
    review.comments.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      path, side, line, body,
      symbol: t.closest('.diff').dataset.csym || null,
      code: row.lastElementChild.textContent,
      created: Date.now(),
    });
  }
  saveReview();
  refreshThreads(path, side, line);
  refreshReviewList();
}
function refreshReviewList() {
  if (view.type !== 'summary') return;
  $('#reviewList').outerHTML = reviewList();
  $('#reviewCount').textContent = review.comments.length;
}
function reviewList() {
  const cs = review.comments.slice().sort(byPosition);
  return `<div id="reviewList">${cs.length ? `<div class="check">${cs.map(c => `<div class="crow"><span class="main"><span class="sub" style="font:12px var(--mono);color:var(--muted)">${esc(c.path)}:${c.line}${c.side === 'LEFT' ? ' (removed line)' : ''}${c.symbol && byId.has(c.symbol) && byId.get(c.symbol).kind !== 'file' ? ' · ' + esc(short(c.symbol)) : ''}</span><p class="cbody">${esc(c.body)}</p></span><button class="linkbtn" type="button" data-c="del-list" data-id="${esc(c.id)}">Delete</button></div>`).join('')}</div>` : '<p class="note">Hover a line in any diff below and click <b>+</b> to comment on it.</p>'}</div>`;
}
function reviewSection() {
  return `<h3>Your review<span class="count" id="reviewCount">${review.comments.length}</span></h3>
    <textarea class="overall" id="overall" aria-label="Overall comment" placeholder="Overall comment (optional)">${esc(review.body)}</textarea>
    ${reviewList()}`;
}
function downloadReview() {
  const pr = D.pr || {}, cs = review.comments.slice().sort(byPosition);
  // The body of GitHub's "create a review" call. Without an `event` it becomes a pending review to submit on GitHub.
  const out = {
    ...(pr.headCommit ? { commit_id: pr.headCommit } : {}),
    ...(review.body.trim() ? { body: review.body.trim() } : {}),
    comments: cs.map(c => ({ path: c.path, line: c.line, side: c.side, body: c.body })),
    dyff: {
      root: D.root,
      ...(pr.baseRef ? { baseRef: pr.baseRef } : {}),
      ...(pr.baseCommit ? { baseCommit: pr.baseCommit } : {}),
      ...(pr.headCommit ? { headCommit: pr.headCommit } : {}),
      // Same order as `comments`: the commented line and the symbol it is in.
      context: cs.map(c => ({ path: c.path, line: c.line, side: c.side, code: c.code, ...(c.symbol ? { symbol: c.symbol } : {}) })),
    },
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2) + '\n'], { type: 'application/json' }));
  a.download = `dyff-review${pr.headCommit ? '-' + pr.headCommit.slice(0, 7) : ''}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-c]');
  if (!b) return;
  const c = b.dataset.c, t = b.closest('.cthread');
  if (c === 'add') openForm(b.closest('.dl').nextElementSibling);
  else if (c === 'save') saveForm(b.closest('.cform'));
  else if (c === 'cancel') refreshThreads(t.dataset.path, t.dataset.side, t.dataset.line);
  else if (c === 'edit') { const el = b.closest('.cmt'), cm = review.comments.find(x => x.id === el.dataset.id); el.remove(); openForm(t, cm?.body || '', el.dataset.id); }
  else if (c === 'del' || c === 'del-list') {
    const id = c === 'del' ? b.closest('.cmt').dataset.id : b.dataset.id, cm = review.comments.find(x => x.id === id);
    if (!cm) return;
    review.comments = review.comments.filter(x => x !== cm);
    saveReview();
    refreshThreads(cm.path, cm.side, cm.line);
    refreshReviewList();
  }
});
document.addEventListener('keydown', e => {
  const f = e.target.closest?.('.cform');
  if (!f) return;
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveForm(f); }
  else if (e.key === 'Escape') f.querySelector('[data-c="cancel"]').click();
});
document.addEventListener('input', e => { if (e.target.id === 'overall') { review.body = e.target.value; saveReview(); } });
$('#dlReview').addEventListener('click', downloadReview);

/* ---------- Files ---------- */
const bySize = (a, b) => (b.change.additions + b.change.deletions) - (a.change.additions + a.change.deletions);
/** A changed file: its changed symbols with their own diffs, then the whole file diff. */
function fileSection(f, collapsed = false) {
  const syms = D.nodes.filter(s => s.file === f.path && s.change && s.change.hunks.length && !(s.kind === 'class' && D.nodes.some(c => c.parent === s.id && c.change)));
  const symHtml = syms.map(s => {
    const c = counts(s.change.hunks);
    return `<details class="sym"${syms.length <= 4 ? ' open' : ''}><summary><span class="sname">${esc(s.kind === 'file' ? 'Imports and top of file' : short(s.id))}</span>${s.route ? routeChip(s.route) : ''}<span class="kind">${esc([s.kind === 'file' ? '' : kindWord(s), statusWord(s.change.status), s.change.signatureChanged ? 'signature changed' : ''].filter(Boolean).join(', '))}</span><span class="grow"></span><span><span class="n-a">+${c.a}</span> <span class="n-d">−${c.d}</span></span></summary>
      <div class="sbody">${diffBlock(s.change.hunks, f.path, s.id)}${s.kind !== 'file' ? `<p style="margin:8px 0 0"><button class="linkbtn" data-sym="${esc(s.id)}">${s.references.length ? `${plural(s.references.length, 'reference')}, ` : ''}open details →</button></p>` : ''}</div></details>`;
  }).join('');
  const ch = f.change;
  const head = `<span class="badge b-${ch.status}">${statusWord(ch.status)}</span>${f.test ? '<span class="badge b-test">test</span>' : ''}${f.other ? '<span class="badge">not analyzed</span>' : ''}<span class="fname">${esc(baseOf(f.path))} <span>${esc(dirOf(f.path))}</span></span><span class="n-a">+${ch.additions}</span><span class="n-d">−${ch.deletions}</span>`;
  const whole = !ch.hunks.length ? '<p class="note" style="padding:10px 12px;margin:0">No text diff (binary file, or only renamed).</p>'
    : syms.length ? `<details class="whole"><summary>Whole file diff</summary><div class="sbody">${diffBlock(ch.hunks, f.path)}</div></details>`
    : `<div class="sbody" style="padding-top:12px">${diffBlock(ch.hunks, f.path)}</div>`;
  const body = `${ch.oldPath ? `<p class="note" style="padding:6px 12px 0;margin:0">Renamed from ${esc(ch.oldPath)}</p>` : ''}${symHtml}${whole}`;
  return collapsed
    ? `<details class="file"><summary class="fhead">${head}</summary>${body}</details>`
    : `<section class="file"><div class="fhead">${head}</div>${body}</section>`;
}
/** Every file the PR touched, analyzed or not. */
function changedFiles() {
  const other = (D.pr?.unindexedFiles || []).map(u => ({ path: u.path, test: false, other: true, change: { status: u.status, oldPath: u.oldPath, additions: u.additions, deletions: u.deletions, hunks: u.hunks || [] } }));
  return [...D.files.filter(f => f.change), ...other].sort((a, b) => (a.test - b.test) || (!!a.other - !!b.other) || bySize(a, b));
}

/* ---------- Module ---------- */
function renderModule(id) {
  const n = M.nodes.get(id), m = n.mod;
  const outs = [...n.out.values()], ins = [...n.inn].map(f => M.nodes.get(f).out.get(id));
  const chip = (e, other) => `<button class="chip ${e.removed ? 'rem' : e.cycle === 'new' ? 'cyc-new' : e.cycle ? 'cyc' : e.changed ? 'chg' : ''}" data-mod="${esc(other)}" title="${e.removed ? 'Removed in this PR' : e.cycle === 'new' ? 'Part of a cycle this PR creates' : e.cycle ? 'Part of a cycle that already existed' : e.changed ? 'New in this PR' : ''}">${esc(M.nodes.get(other).name)}${e.kinds.has('module-import') ? '' : ' (file)'}</button>`;
  let why;
  if (n.changed) why = `${plural(n.files.length, 'file')} ${n.state === 'added' ? 'added' : n.state === 'removed' ? 'removed' : 'changed'} in this PR.`;
  else if (n.affected) why = 'Not changed in this PR, but its code references something that did. Worth a look when reviewing.';
  else why = 'Not changed in this PR.';
  const declHtml = m.declared ? [
    ['Providers', m.providers.map(p => p.via === 'class' ? short(p.token) : `${tokenLabel(p.token)} → ${p.target ? short(p.target) : p.via}`)],
    ['Controllers', m.controllers.map(tokenLabel)],
    ['Exports', m.exports.map(tokenLabel)],

  ].filter(([, xs]) => xs.length).map(([k, xs]) => `<p class="decl">${k}: ${xs.map(x => `<code>${esc(x)}</code>`).join(', ')}</p>`).join('') : '<p class="decl">No <code>*.module.ts</code> here; files in this folder are grouped by location.</p>';
  const broken = D.checks.danglingReferences.filter(d => byId.get(d.from)?.module === id);
  const files = n.files.slice().sort(bySize).map(f => fileSection(f)).join('');

  $('#pin').innerHTML = `
    <button class="back" data-action="back">← Back</button>
    <h2>${esc(n.name)}</h2><p class="path">${esc(m.file || n.id)}</p>
    <p class="lead">${esc(why)}</p>${declHtml}
    ${zoom === id ? '' : `<p><button class="linkbtn" data-action="zoom" data-zoom="${esc(id)}">Show its files in the map →</button></p>`}
    ${broken.length ? `<h3>Broken references<span class="count warn">${broken.length}</span></h3><div class="refs">${broken.map(d => symBtn(d.from, ` · uses removed ${esc(symLabel(d.to))}`)).join('')}</div>` : ''}
    ${outs.length ? `<h3>Depends on</h3><div class="chips">${outs.map(e => chip(e, e.to)).join('')}</div>` : ''}
    ${ins.length ? `<h3>Used by</h3><div class="chips">${ins.map(e => chip(e, e.from)).join('')}</div>` : ''}
    ${routes.length ? `<h3>Routes</h3><div class="refs">${routes.map(r => `<button data-sym="${esc(r.id)}">${esc(routeText(r.route))} <small>${esc(short(r.id))}</small></button>`).join('')}</div>` : ''}
    ${n.files.length ? `<h3>What changed</h3>${files}` : ''}`;
}

/* ---------- Symbol focus ---------- */
function tree(id, dir, depth, seen) {
  if (depth === 0) return '';
  const next = (dir === 'up' ? byId.get(id)?.references : byId.get(id)?.uses) || [];
  const items = next.filter(x => byId.has(x) && !seen.has(x));
  if (!items.length) return '';
  items.forEach(x => seen.add(x));
  return `<ul class="tree${seen.size === items.length + 1 ? ' root' : ''}">${items.slice(0, 30).map(x => {
    const n = byId.get(x);
    return `<li><button data-sym="${esc(x)}">${esc(symLabel(x))}${n.route ? ' ' + routeChip(n.route) : ''}${n.change ? ` <span class="badge b-${n.change.status}">${statusWord(n.change.status)}</span>` : ''}${n.test ? ' <span class="badge b-test">test</span>' : ''}</button>${tree(x, dir, depth - 1, seen)}</li>`;
  }).join('')}${items.length > 30 ? `<li class="note">…and ${items.length - 30} more</li>` : ''}</ul>`;
}
function renderSymbol(id) {
  const n = byId.get(id);
  if (!n) return;
  const C = D.checks;
  const ch = n.change;
  const routes = C.affectedRoutes.filter(r => r.changed === id || r.chain.includes(id));
  const tests = C.tests.find(t => t.id === id);
  const sig = C.signatureChanges.find(s => s.id === id);
  const broken = C.danglingReferences.filter(d => d.from === id || d.to === id);
  const typeOnly = new Set(n.typeUses || []);
  const children = D.nodes.filter(c => c.parent === id);
  // A whole file gets the same breakdown as in a module: imports and top of file, then each changed symbol.
  const file = n.kind === 'file' ? fileByPath.get(n.file) : null;
  $('#pin').innerHTML = `
    <button class="back" data-action="back">← Back</button>
    <h2>${esc(n.kind === 'file' ? baseOf(n.file) : short(id))}</h2>
    <p class="path">${esc(n.file)}:${n.range[0]}–${n.range[1]} · ${esc(kindWord(n))} · <button class="linkbtn" data-mod="${esc(n.module)}">${esc(modName(n.module))}</button></p>
    <div class="chips" style="margin-bottom:10px">${ch ? `<span class="badge b-${ch.status}">${statusWord(ch.status)} in this PR</span>` : '<span class="badge">unchanged</span>'}${n.route ? routeChip(n.route) : ''}${n.test ? '<span class="badge b-test">test</span>' : ''}${n.decorators ? n.decorators.map(d => `<span class="badge">@${esc(d)}</span>`).join('') : ''}</div>
    ${n.signature || ch?.previousSignature ? `<div class="sig">${ch?.signatureChanged ? `<span class="l">Before</span><span class="b">${esc(ch.previousSignature)}</span><span class="l">After</span><span class="a">${esc(n.signature)}</span>` : `<span class="l">Signature</span><span>${esc(n.signature)}</span>`}</div>` : ''}
    ${broken.length ? `<h3>Broken references<span class="count warn">${broken.length}</span></h3><div class="refs">${broken.map(d => d.from === id ? symBtn(d.to, ' · removed by this PR') : symBtn(d.from, ' · still calls this')).join('')}</div>` : ''}
    ${sig && sig.callersOutsidePr.length ? `<h3>Callers to check<span class="count warn">${sig.callersOutsidePr.length}</span></h3><p class="note">The signature changed; these callers are outside the PR.</p><div class="refs">${sig.callersOutsidePr.map(r => symBtn(r)).join('')}</div>` : ''}
    ${file?.change ? `<h3>What changed</h3>${fileSection(file)}` : ch && ch.hunks.length ? `<h3>Diff</h3>${diffBlock(ch.hunks, n.file, n.id)}` : ''}
    ${routes.length ? `<h3>Reaches routes<span class="count">${routes.length}</span></h3><div class="check">${routes.map(r => `<button class="row" data-sym="${esc(r.routeId)}"><span class="main">${routeChip(r.route)}</span><span class="chain">${r.chain.map(x => `<span>${esc(symLabel(x))}</span>`).join('')}</span></button>`).join('')}</div>` : ''}
    ${tests ? `<h3>Tests that reach it<span class="count ${tests.testFiles.length ? '' : 'warn'}">${tests.testFiles.length}</span></h3>${tests.testFiles.length ? `<div class="refs">${tests.testFiles.map(f => symBtn(f)).join('')}</div>` : '<p class="note">No spec file reaches this through references.</p>'}` : ''}
    ${n.injects ? `<h3>Injects</h3><div class="refs">${n.injects.map(i => i.target ? symBtn(i.target, ` · ${esc(i.param)}${i.kind !== 'class' ? ' via ' + esc(i.decorator || 'token') + ' ' + esc(tokenLabel(i.token)) : ''}`) : `<button disabled>${esc(i.param)} <small>${esc(tokenLabel(i.token))}</small></button>`).join('')}</div>` : ''}
    <h3>Called from<span class="count">${n.references.length}</span></h3>
    ${n.references.length ? `<p class="note">Callers, and their callers, up to 3 steps.</p>${tree(id, 'up', 3, new Set([id]))}` : '<p class="note">Nothing references this.</p>'}

    ${n.uses.length ? `<div class="refs">${n.uses.map(u => byId.has(u) ? symBtn(u, typeOnly.has(u) ? ' · type only' : '') : '').join('')}</div>` : '<p class="note">No references to other project code.</p>'}
    ${children.length ? `<h3>Members<span class="count">${children.length}</span></h3><div class="refs">${children.map(c => symBtn(c.id, c.change ? ' · ' + statusWord(c.change.status) : '')).join('')}</div>` : ''}`;
}

/* ---------- Navigation ---------- */
let view = { type: 'summary' };
function go(next, push = true) {
  if (push) history.push(view);
  view = next;
  zoom = view.zoom && M.nodes.has(view.zoom) ? view.zoom : null;
  selected = !zoom && view.type === 'module' ? view.id : null;
  hot = new Set();
  const sym = view.type === 'symbol' ? byId.get(view.id) : null;
  if (zoom && sym) {
    // In the file view a file is selected; a symbol inside a file lights up the files it is used from and uses.
    if (sym.kind === 'file') selected = sym.file;
    else for (const x of [sym.id, ...sym.references, ...sym.uses]) { const f = fileByPath.get(byId.get(x)?.file); if (f) hot.add(fileKey(f)); }
  } else if (view.type === 'symbol') {
    const n = byId.get(view.id);
    if (n) { hot.add(n.module); for (const r of n.references) hot.add(byId.get(r)?.module); for (const u of n.uses) hot.add(byId.get(u)?.module); hot.delete(undefined); }
  }
  if (view.type === 'summary') renderSummary();
  else if (view.type === 'module') renderModule(view.id);
  else renderSymbol(view.id);
  renderGraph();
  $('#panel').scrollTop = 0;
  if (view.type !== 'summary' && window.matchMedia('(max-width: 960px)').matches) $('#panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const back = () => go(history.pop() || { type: 'summary' }, false);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mod],[data-sym],[data-action]');
  if (!b || b.disabled) return;
  if (b.closest('#results')) { $('#results').hidden = true; $('#q').value = ''; }
  if (b.dataset.action === 'back') back();
  else if (b.dataset.action === 'zoom') go({ type: 'module', id: b.dataset.zoom, zoom: b.dataset.zoom });
  else if (b.dataset.action === 'unzoom') go({ type: 'module', id: zoom });
  else if (zoom && b.dataset.sym) {
    // A symbol from another module opens that module's files.
    const z = fileByPath.get(byId.get(b.dataset.sym)?.file)?.module || zoom;
    go(b.closest('.node') && selected === b.dataset.sym ? { type: 'module', id: zoom, zoom } : { type: 'symbol', id: b.dataset.sym, zoom: z });
  }
  // In the file view another module opens its own files.
  else if (zoom && b.dataset.mod) go({ type: 'module', id: b.dataset.mod, zoom: b.dataset.mod });
  else if (b.dataset.sym) go({ type: 'symbol', id: b.dataset.sym });
  else if (b.dataset.mod) go(selected === b.dataset.mod ? { type: 'summary' } : { type: 'module', id: b.dataset.mod });
});
$('#canvas').addEventListener('click', e => {
  if (e.target.closest('.node')) return;
  if (zoom) { if (view.type !== 'module' || view.id !== zoom) go({ type: 'module', id: zoom, zoom }); }
  else if (view.type !== 'summary') go({ type: 'summary' });
});
$('#canvas').addEventListener('dblclick', e => { const g = e.target.closest('.node[data-mod]'); if (g && !zoom) go({ type: 'module', id: g.dataset.mod, zoom: g.dataset.mod }); });
$('#canvas').addEventListener('keydown', e => { const g = e.target.closest('.node'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
$('#showAll').addEventListener('change', e => { showAll = e.target.checked; renderGraph(); });
$('#showLinks').addEventListener('change', e => { showLinks = e.target.checked; renderGraph(); });
$('#showCycles').addEventListener('change', e => { showCycles = e.target.checked; renderGraph(); });
const hoverLinks = id => {
  if (id === hoverMod) return;
  hoverMod = id;
  for (const p of $('#canvas').querySelectorAll('.edge.ctx')) p.classList.toggle('on', !!id && (p.dataset.a === id || p.dataset.b === id));
};
$('#canvas').addEventListener('mouseover', e => hoverLinks(e.target.closest('.node')?.dataset.k ?? null));
$('#canvas').addEventListener('mouseleave', () => hoverLinks(null));
$('#canvas').addEventListener('focusin', e => hoverLinks(e.target.closest('.node')?.dataset.k ?? null));
$('#showTests').addEventListener('change', e => { showTests = e.target.checked; build(); go(view, false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && view.type !== 'summary' && document.activeElement !== $('#q') && !e.target.closest?.('textarea')) back(); });

/* ---------- Search ---------- */
let searchIndex = [];
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim().toLowerCase(), box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  const hits = searchIndex.filter(s => s.key.includes(q)).sort((a, b) => (a.key.indexOf(q) - b.key.indexOf(q)) || a.label.length - b.label.length).slice(0, 30);
  box.innerHTML = hits.length ? hits.map((h, i) => `<button ${h.mod ? `data-mod="${esc(h.mod)}"` : `data-sym="${esc(h.id)}"`} class="${i ? '' : 'on'}">${esc(h.label)}<small>${esc(h.sub)}</small></button>`).join('') : '<p class="note" style="padding:6px 8px;margin:0">No matches</p>';
  box.hidden = false;
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const b = $('#results button.on'); if (b) b.click(); }
  if (e.key === 'Escape') { $('#q').value = ''; $('#results').hidden = true; }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });

function title() {
  const pr = D.pr || {};
  return pr.baseRef ? `Changes against ${pr.baseRef}` : 'Pull request';
}

/* ---------- Load ---------- */
(window.DYFF_DATA ? Promise.resolve(window.DYFF_DATA) : fetch('index.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })).then(data => {
  D = data;
  if (!D.checks) { $('#pin').innerHTML = '<p class="empty">This index has no PR checks. Serve the output of <code>dyff merge</code> or <code>dyff pr</code>.</p>'; return; }
  const pr = D.pr || {};
  $('#prTitle').innerHTML = `${esc(baseOf(D.root))} · ${esc(title())}${pr.headCommit ? `<small>${esc(pr.baseCommit?.slice(0, 7) || '')}…${esc(pr.headCommit.slice(0, 7))}</small>` : ''}`;
  document.title = `dyff · ${baseOf(D.root)}`;
  loadReview();
  searchIndex = [
    ...D.nodes.filter(n => n.kind !== 'file').map(n => ({ id: n.id, label: short(n.id) + (n.route ? '  ' + routeText(n.route) : ''), sub: n.file, key: (short(n.id) + ' ' + (n.route ? routeText(n.route) : '')).toLowerCase() })),
    ...D.modules.map(m => ({ mod: m.id, label: m.name, sub: m.id, key: (m.name + ' ' + m.id).toLowerCase() })),
  ];
  build();
  go({ type: 'summary' }, false);
}).catch(err => { $('#pin').innerHTML = `<p class="empty">Could not load index.json (${esc(err.message)}).</p>`; });
})();
</script>
</body>
</html>
